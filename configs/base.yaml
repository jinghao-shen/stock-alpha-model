# ── Model architecture ────────────────────────────────────────────
model:
  emb_model: "Qwen/Qwen3-Embedding-0.6B"
  emb_proj: 128          # bottleneck: project 1024-dim embedding down before concat
  hidden: [64]           # MLP head layers after concat(emb_proj, num_features)
  dropout: 0.3

# ── Training ──────────────────────────────────────────────────────
training:
  epochs: 50
  lr: 3.0e-5
  weight_decay: 1.0e-3
  batch_size: 128
  patience: 10           # early stop on val IC
  ic_lambda: 0.5         # loss = MSE + lambda * (1 - batch_IC)
  n_seeds: 5             # ensemble size; predictions averaged across seeds
  seed: 42

# ── Features ──────────────────────────────────────────────────────
features:
  numeric: [ret_1d, ret_5d, vol_5d, vol_ratio, range_pct]
  max_titles: 5          # cap news titles per sample to bound prompt length

# ── Backtest ──────────────────────────────────────────────────────
backtest:
  top_q: 0.20            # long top-20% by predicted alpha
  bot_q: 0.20            # short bottom-20%
  min_pool: 8            # skip dates with fewer than this many stocks
  min_leg: 2             # minimum stocks per long/short leg
  hold_days: 7           # non-overlapping rebalance window (trading days)

# ── Baselines ─────────────────────────────────────────────────────
baselines:
  ridge_alphas: [0.01, 0.1, 1.0, 10.0, 100.0]
  lstm:
    seq_len: 20
    seq_features: [ret_1d, vol_ratio]
    hidden: 64
    num_layers: 2
    dropout: 0.2
    n_seeds: 5

# ── Sliding-window ────────────────────────────────────────────────
sliding:
  window_days: 59        # matches 2017-11-01 → 2017-12-29 span
  wf_start: "2018-01-01"
  wf_end:   "2019-12-31"
